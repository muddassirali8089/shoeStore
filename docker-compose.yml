services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules # Keeps the Linux node_modules safe
    restart: always

  client:
    build: ./client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules # Keeps the Linux node_modules safe
    environment:
      - CHOKIDAR_USEPOLLING=true # Forces Vite to detect Windows file changes
    depends_on:
      - server
    restart: always