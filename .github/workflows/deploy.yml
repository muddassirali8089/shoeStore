name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ]; then
            echo "ERROR: Docker Hub username is empty"
            exit 1
          fi

          if [ -z "$DH_TOKEN" ]; then
            echo "ERROR: Docker Hub token is empty"
            exit 1
          fi

          if [[ "$DH_USER" =~ [[:space:]] ]]; then
            echo "ERROR: Username contains whitespace"
            exit 1
          fi

          if [[ "$DH_TOKEN" =~ [[:space:]] ]]; then
            echo "ERROR: Token contains whitespace"
            exit 1
          fi

          echo "SUCCESS: Both Docker Hub secrets are available."

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shoe-server:latest

      - name: Build and push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shoe-client:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          debug: true
          script: |
            set -e
            cd ~/shoeStore
            docker compose pull
            docker compose up -d
            docker image prune -f